# Builds the site and uploads it to GoDaddy over explicit FTPS.
#
# Requires one repository secret: FTP_PASSWORD
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
# The upload is strictly additive: it overwrites the files it sends and never
# deletes anything already on the server. That is deliberate — the diagnostics
# subdomain lives in its own folder under the web root, and a mirroring deploy
# would wipe it. Superseded hashed assets accumulate instead; they are
# unreferenced and can be pruned by hand occasionally.
name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to the web root at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to the web root over FTPS
        env:
          # cPanel advertises ftp.<domain>, but that subdomain has no DNS
          # record and the apex is on shared hosting, whose FTPS certificate
          # is issued for the provider's own infrastructure. Both are tried
          # first anyway, so a properly matching name takes over if one is
          # ever configured.
          FTP_HOSTS: "ftp.spinesight.health spinesight.health"
          FTP_USER: Suhaib@spinesight.health
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::The FTP_PASSWORD repository secret is not set, so there is nothing to authenticate with."
            exit 1
          fi

          # Arguments shared by every FTP call below.
          common=(--fail --silent --show-error --ssl-reqd
                  --connect-timeout 20 --retry 3 --retry-delay 5
                  --user "$FTP_USER:$FTP_PASSWORD")

          host=""      # name used in URLs, and the name the certificate must match
          resolve=()   # pins that name to an address where DNS would not

          # 1. Prefer a configured name that verifies on its own.
          echo "Trying configured hosts:"
          for candidate in $FTP_HOSTS; do
            if ! getent hosts "$candidate" >/dev/null 2>&1; then
              echo "  $candidate -- no DNS record"
              continue
            fi
            if err=$(curl "${common[@]}" --list-only "ftp://$candidate/" 2>&1 >/dev/null); then
              host="$candidate"
              echo "  $candidate -- verified"
              break
            fi
            echo "  $candidate -- ${err%%$'\n'*}"
          done

          # 2. Otherwise ask the server which name its certificate is for and
          #    verify against that, pinned to this account's address.
          #
          #    Shared hosting answers for the provider's infrastructure name,
          #    never the customer domain, so no name under spinesight.health
          #    can ever match. The alternative is --insecure, which encrypts
          #    but authenticates nothing: credentials that can rewrite the
          #    live site would go to whoever answered. Verifying against the
          #    provider's real CA-issued identity keeps that guarantee.
          if [ -z "$host" ]; then
            ip=""
            for candidate in $FTP_HOSTS; do
              ip=$(getent hosts "$candidate" | awk '{print $1; exit}') || true
              [ -n "${ip:-}" ] && break
            done
            if [ -z "${ip:-}" ]; then
              echo "::error::None of these hosts resolve: $FTP_HOSTS"
              exit 1
            fi

            san=$(timeout 20 openssl s_client -starttls ftp -connect "$ip:21" \
                  </dev/null 2>/dev/null \
                  | openssl x509 -noout -ext subjectAltName 2>/dev/null) || true
            echo "Certificate names offered by $ip:"
            printf '%s\n' "$san" | sed 's/^/  /'

            # An exact name is best. A wildcard is usable with any one label,
            # since the server presents the same certificate either way.
            host=$(grep -o 'DNS:[^,]*' <<<"$san" \
                   | sed 's/^DNS: *//; s/[[:space:]]*$//' \
                   | grep -v '^\*' | head -1) || true
            if [ -z "${host:-}" ]; then
              wildcard=$(grep -o 'DNS:\*\.[^,]*' <<<"$san" \
                         | sed 's/^DNS:\*\.//; s/[[:space:]]*$//' | head -1) || true
              [ -n "${wildcard:-}" ] && host="ftp.$wildcard"
            fi
            if [ -z "${host:-}" ]; then
              echo "::error::The server at $ip offered no usable certificate name."
              exit 1
            fi

            resolve=(--resolve "$host:21:$ip")
            echo "Verifying as $host, pinned to $ip"

            if ! err=$(curl "${common[@]}" "${resolve[@]}" --list-only "ftp://$host/" 2>&1 >/dev/null); then
              echo "::error::Could not open a verified FTPS session as $host: ${err%%$'\n'*}"
              exit 1
            fi
          fi
          echo "FTP host: $host"

          # Show where this account actually lands. If anything about the
          # target is wrong, this listing is what explains it.
          root_listing=$(curl "${common[@]}" "${resolve[@]}" --list-only "ftp://$host/")
          echo "FTP account root contains:"
          printf '%s\n' "$root_listing" | sed 's/^/  /'

          # Some accounts land in the hosting root (which holds public_html),
          # others are scoped to a web root directly.
          if grep -qx 'public_html' <<<"$root_listing"; then
            base="ftp://$host/public_html"
            echo "Target: public_html (account sits above the web root)"
          else
            base="ftp://$host"
            echo "Target: the account's own root"
          fi

          # Prove the target is the live site root before writing a single
          # file. cPanel scopes a new FTP account to public_html/<login> by
          # default, and deploying into that subfolder would create a junk
          # directory while leaving the real site untouched -- a silent
          # non-deploy, which is worse than a failed one.
          target_listing=$(curl "${common[@]}" "${resolve[@]}" --list-only "$base/")
          if ! grep -qxE 'index\.html|assets' <<<"$target_listing"; then
            echo "::error::The deploy target does not look like the site root -- no index.html or assets/ found. The FTP account is most likely scoped to the wrong directory; it should point at public_html. See the listing above for what it can actually see."
            exit 1
          fi

          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::dist/ is empty -- the build produced nothing to deploy."
            exit 1
          fi

          for file in "${files[@]}"; do
            rel="${file#dist/}"
            curl "${common[@]}" "${resolve[@]}" --ftp-create-dirs \
              --upload-file "$file" "$base/$rel"
            echo "  uploaded $rel"
          done

          echo "Uploaded ${#files[@]} files."

      - name: Confirm the live site serves the new build
        run: |
          set -euo pipefail

          # index.html points at a content-hashed bundle, so seeing that exact
          # filename on the live site proves this build is the one being served.
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Looking for $bundle on https://spinesight.health/"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 \
                 "https://spinesight.health/?cachebust=$GITHUB_RUN_ID" \
                 | grep -q "$bundle"; then
              echo "Live site is serving $bundle."
              exit 0
            fi
            echo "  attempt $attempt: not visible yet, waiting..."
            sleep 10
          done

          echo "::warning::The live site did not report $bundle within 50s. The upload itself succeeded, so this is most likely caching or propagation — check https://spinesight.health/ directly."
