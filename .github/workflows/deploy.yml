# Builds the site and uploads it to GoDaddy over explicit FTPS.
#
# Requires one repository secret: FTP_PASSWORD
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
# The upload is strictly additive: it overwrites the files it sends and never
# deletes anything already on the server. That is deliberate — the diagnostics
# subdomain lives in its own folder under the web root, and a mirroring deploy
# would wipe it. Superseded hashed assets accumulate instead; they are
# unreferenced and can be pruned by hand occasionally.
name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to the web root at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to the web root over FTPS
        env:
          # The apex is on shared hosting; ftp.<domain> has no DNS record.
          # Only the address is taken from these -- the name used for
          # certificate verification comes from the server itself.
          FTP_HOSTS: "ftp.spinesight.health spinesight.health"
          # cPanel does not always preserve the capitalisation typed into
          # its form, and FTP logins are case sensitive.
          FTP_USERS: "Suhaib@spinesight.health suhaib@spinesight.health"
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::The FTP_PASSWORD repository secret is not set, so there is nothing to authenticate with."
            exit 1
          fi

          # 1. The address to talk to.
          ip=""
          for name in $FTP_HOSTS; do
            ip=$(getent hosts "$name" | awk '{print $1; exit}') || true
            [ -n "${ip:-}" ] && break
          done
          if [ -z "${ip:-}" ]; then
            echo "::error::None of these hosts resolve: $FTP_HOSTS"
            exit 1
          fi

          # 2. A name the server's certificate actually carries.
          #
          #    Shared hosting answers for the provider's infrastructure, never
          #    the customer domain, so no name under spinesight.health can
          #    match. The alternative is --insecure, which encrypts but
          #    authenticates nothing: credentials able to rewrite the live
          #    site would go to whoever answered. Reading the certificate and
          #    pinning a name it is valid for keeps that guarantee.
          san=$(timeout 20 openssl s_client -starttls ftp -connect "$ip:21" \
                </dev/null 2>/dev/null \
                | openssl x509 -noout -ext subjectAltName 2>/dev/null) || true
          host=$(grep -o 'DNS:[^,]*' <<<"$san" \
                 | sed 's/^DNS: *//; s/[[:space:]]*$//' \
                 | grep -v '^\*' | head -1) || true
          if [ -z "${host:-}" ]; then
            wildcard=$(grep -o 'DNS:\*\.[^,]*' <<<"$san" \
                       | sed 's/^DNS:\*\.//; s/[[:space:]]*$//' | head -1) || true
            [ -n "${wildcard:-}" ] && host="ftp.$wildcard"
          fi
          if [ -z "${host:-}" ]; then
            echo "::error::The server at $ip offered no usable certificate name."
            exit 1
          fi

          common=(--fail --silent --show-error --ssl-reqd
                  --connect-timeout 20 --retry 3 --retry-delay 5
                  --resolve "$host:21:$ip")
          echo "Verifying as $host, pinned to $ip"

          # 3. The login the account was actually created under.
          user=""
          for candidate in $FTP_USERS; do
            if err=$(curl "${common[@]}" --user "$candidate:$FTP_PASSWORD" \
                       --list-only "ftp://$host/" 2>&1 >/dev/null); then
              user="$candidate"
              echo "FTP login: $candidate"
              break
            fi
            echo "FTP login: $candidate rejected -- ${err%%$'\n'*}"
          done
          if [ -z "$user" ]; then
            echo "::error::None of these logins were accepted: $FTP_USERS"
            exit 1
          fi
          auth=(--user "$user:$FTP_PASSWORD")

          # 4. The live site root, confirmed by content rather than assumed.
          #
          #    The account may be scoped straight to the web root, or to a
          #    directory holding it, and cPanel's own default scopes it to a
          #    fresh empty folder. Uploading into the wrong one would leave
          #    the live site untouched while reporting success -- a silent
          #    non-deploy, worse than a failure.
          is_site_root() {
            local listing
            listing=$(curl "${common[@]}" "${auth[@]}" --list-only "$1/" 2>/dev/null) || return 1
            grep -qxE 'index\.html|assets' <<<"$listing"
          }

          base=""
          if is_site_root "ftp://$host"; then
            base="ftp://$host"
            echo "Site root: the account's own root"
          else
            root_listing=$(curl "${common[@]}" "${auth[@]}" --list-only "ftp://$host/")
            echo "Account root contains:"
            printf '%s\n' "$root_listing" | sed 's/^/  /'
            checked=0
            while IFS= read -r entry; do
              case "$entry" in .|..|"") continue ;; esac
              checked=$((checked + 1))
              [ "$checked" -gt 25 ] && break
              if is_site_root "ftp://$host/$entry"; then
                base="ftp://$host/$entry"
                echo "Site root: $entry"
                break
              fi
            done <<<"$root_listing"
          fi

          if [ -z "$base" ]; then
            echo "::error::Nothing at or below the account's root looks like the live site -- no index.html or assets/ found. The account is scoped to the wrong directory; it should point at the web root (public_html). The listing above shows what it can see."
            exit 1
          fi

          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::dist/ is empty -- the build produced nothing to deploy."
            exit 1
          fi

          for file in "${files[@]}"; do
            rel="${file#dist/}"
            curl "${common[@]}" "${auth[@]}" --ftp-create-dirs \
              --upload-file "$file" "$base/$rel"
            echo "  uploaded $rel"
          done

          echo "Uploaded ${#files[@]} files."

      - name: Confirm the live site serves the new build
        run: |
          set -euo pipefail

          # index.html points at a content-hashed bundle, so seeing that exact
          # filename on the live site proves this build is the one being served.
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Looking for $bundle on https://spinesight.health/"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 \
                 "https://spinesight.health/?cachebust=$GITHUB_RUN_ID" \
                 | grep -q "$bundle"; then
              echo "Live site is serving $bundle."
              exit 0
            fi
            echo "  attempt $attempt: not visible yet, waiting..."
            sleep 10
          done

          echo "::warning::The live site did not report $bundle within 50s. The upload itself succeeded, so this is most likely caching or propagation — check https://spinesight.health/ directly."
